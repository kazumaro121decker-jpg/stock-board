name: 株価データ更新と公開

on:
  schedule:
    # 平日: 15分ごと (UTC表記。東証・米国市場の取引時間をカバー)
    - cron: "*/15 * * * 1-5"
    # 土日: 3時間ごと (為替・暗号資産・ニュース用)
    - cron: "7 */3 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: サイトを組み立て
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons _site/
          mkdir -p _site/data
          cp data/watchlist.json data/universe.json _site/data/

      - name: 株価を取得
        env:
          PREV_STATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/state.json
        run: python scripts/fetch_quotes.py --out _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 60日間リポジトリに動きがないと定期実行が止まるため、月1回だけ記録を残す
      - name: 定期実行の維持
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "stock-board-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .keepalive
            git add .keepalive
            git commit -m "定期実行の維持"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
